# /etc/nginx/sites-available/erp  -> symlink into sites-enabled
#
# Single upstream: the frontend container already proxies /api and /uploads
# to the backend over the compose network, so everything stays same-origin
# and CORS never comes into play.

server {
    listen 80;
    listen [::]:80;
    server_name erp.yourdomain.com;

    # certbot will rewrite this block to redirect to 443 after you run it.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite's HMR uses a websocket; without these it retries and spams the console.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # File uploads — default is 1m, which silently truncates larger ones.
        client_max_body_size 25m;

        proxy_read_timeout 300s;
    }
}
