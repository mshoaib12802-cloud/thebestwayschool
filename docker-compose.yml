version: '3.8'

services:

  mongo:
    image: mongo:latest
    container_name: erp_database
    restart: always
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: erp_backend
    restart: always
    ports:
      # Bound to loopback only — nginx is the public entrypoint.
      - "127.0.0.1:8091:5000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/institute_erp
      - NODE_ENV=production
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:8090}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8090}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: erp_frontend
    restart: always
    ports:
      # Bound to loopback only — nginx proxies the public domain here.
      - "127.0.0.1:8090:3000"
    environment:
      - VITE_API_URL=http://backend:5000
      # Vite 5.4+ rejects unknown Host headers; list the domain nginx sends.
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-localhost}
    depends_on:
      - backend

volumes:
  mongo-data:
  uploads-data:
